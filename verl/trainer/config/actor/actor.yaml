# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# Target class for this configuration
_target_: verl.workers.config.ActorConfig

# Number of rollouts per update (mirrors actor rollout_n)
rollout_n: ${oc.select:actor_rollout_ref.rollout.n,1}

# the abstract actor configs
# fsdp, fsdp2 or megatron. must be set.
strategy: ???

# Split each sample into sub-batches of this size for PPO
ppo_mini_batch_size: 256

# [Deprecated] Global micro batch size
ppo_micro_batch_size: null

# Local per-GPU micro batch size
ppo_micro_batch_size_per_gpu: null

# Whether to automatically adjust batch size at runtime
# oc.select: the default val for ref.log_prob_use_dynamic_bsz
use_dynamic_bsz: false

# Max tokens per GPU in one PPO batch; affects gradient accumulation
# Typically it should be: n * ${data.max_prompt_length} + ${data.max_response_length}
# oc.select: the default val for ref.log_prob_max_token_len_per_gpu
ppo_max_token_len_per_gpu: 16384

# PPO clip ratio
clip_ratio: 0.2

# Lower bound for asymmetric clipping (used in dual-clip PPO)
clip_ratio_low: 0.2

# Upper bound for asymmetric clipping (used in dual-clip PPO)
clip_ratio_high: 0.2

# Positive and negative tau for smoothing function in SAPO (https://arxiv.org/pdf/2511.20347)
# default values used in the paper with Qwen3-30B-A3B-Base
tau_pos: 1.0

# negative tau for smoothing function in SAPO
tau_neg: 1.05

# Whether to freeze vision model, if set true, it will be freeze vision model
freeze_vision_tower: false

# policy loss config
policy_loss:

  # # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.PolicyLossConfig

  # Loss function mode: vanilla / clip-cov / kl-cov /gpg from https://arxiv.org/abs/2505.22617
  loss_mode: "vanilla"

  # Ratio of tokens to be clipped for clip-cov loss
  clip_cov_ratio: 0.0002

  # Lower bound for clip-cov loss
  clip_cov_lb: 1.0

  # Upper bound for clip-cov loss
  clip_cov_ub: 5.0

  # Ratio of tokens to be applied kl penalty for kl-cov loss
  kl_cov_ratio: 0.0002

  # KL divergence penalty coefficient
  ppo_kl_coef: 0.1

# Constant C in Dual-clip PPO; clips when advantage < 0 and ratio > C
clip_ratio_c: 3.0

# Loss aggregation mode: "token-mean", "seq-mean-token-sum", "seq-mean-token-mean", or "seq-mean-token-sum-norm"
loss_agg_mode: token-mean

# Scale factor for "seq-mean-token-sum-norm" loss aggregation mode.
# If null, uses response_length. Set to a constant to ensure consistent normalization.
loss_scale_factor: null

# Entropy regularization coefficient in PPO loss
entropy_coeff: 0

# W4A4/W4A8 periodic activation-amax re-calibration: every N policy updates the Megatron
# actor re-runs modelopt max-calibration to refresh the otherwise-frozen input_quantizer
# amax so the FP4 activation scale tracks the drifting activation range (0 = off).
recalib_every: 0

# Enable per-token policy-gradient downweighting based on FSDP/vLLM logprob gap.
pg_mask_enable: false

# Lower logprob-gap threshold for policy-gradient downweighting.
pg_mask_delta_min: null

# Upper logprob-gap threshold for policy-gradient downweighting.
pg_mask_delta_max: null

# Weight applied to policy-gradient tokens selected by pg_mask thresholds.
pg_mask_bad_weight: 0.0

# Enable auxiliary FSDP/vLLM logprob alignment loss.
vllm_align_enable: false

# Coefficient for auxiliary FSDP/vLLM logprob alignment loss.
vllm_align_coef: 0.0

# Token objective for auxiliary alignment: k3, huber, mse, or abs.
vllm_align_loss_type: k3

# Lower logprob-gap threshold for auxiliary alignment.
vllm_align_delta_min: null

# Upper logprob-gap threshold for auxiliary alignment.
vllm_align_delta_max: null

# Lower absolute logprob-gap threshold for auxiliary alignment.
vllm_align_abs_delta_min: null

# Upper absolute logprob-gap threshold for auxiliary alignment.
vllm_align_abs_delta_max: null

# Lower advantage threshold for auxiliary alignment.
vllm_align_adv_min: null

# Upper advantage threshold for auxiliary alignment.
vllm_align_adv_max: null

# Restrict auxiliary alignment to positive segment-gate tokens.
vllm_align_segment_pos_enable: false

# Huber beta used when vllm_align_loss_type is huber.
vllm_align_huber_beta: 1.0

# Normalize auxiliary alignment by active window tokens instead of all response tokens.
vllm_align_normalize_by_window: false

# Minimum denominator fraction when normalizing auxiliary alignment by active window.
vllm_align_min_window_fraction: 0.0

# Optional cap for per-token auxiliary alignment objective.
vllm_align_loss_cap: null

# Enable hard-tail auxiliary FSDP/vLLM logprob alignment loss.
vllm_align_hard_enable: false

# Coefficient for hard-tail auxiliary alignment loss.
vllm_align_hard_coef: 0.0

# Token objective for hard-tail auxiliary alignment.
vllm_align_hard_loss_type: huber

# Lower logprob-gap threshold for hard-tail auxiliary alignment.
vllm_align_hard_delta_min: null

# Upper logprob-gap threshold for hard-tail auxiliary alignment.
vllm_align_hard_delta_max: null

# Lower absolute logprob-gap threshold for hard-tail auxiliary alignment.
vllm_align_hard_abs_delta_min: null

# Upper absolute logprob-gap threshold for hard-tail auxiliary alignment.
vllm_align_hard_abs_delta_max: null

# Huber beta used by hard-tail auxiliary alignment.
vllm_align_hard_huber_beta: 1.0

# Normalize hard-tail auxiliary alignment by active window tokens.
vllm_align_hard_normalize_by_window: false

# Optional cap for hard-tail per-token auxiliary alignment objective.
vllm_align_hard_loss_cap: null

# Enable mean logprob-gap guard to prevent train/rollout IS drift.
delta_mean_guard_enable: false

# Coefficient for mean logprob-gap guard.
delta_mean_guard_coef: 0.0

# Target lower bound for mean(logp_train - logp_vllm).
delta_mean_guard_target: -0.01

# Guard aggregation mode: token or seq.
delta_mean_guard_mode: token

# Optional logprob-gap window for mean guard.
delta_mean_guard_delta_min: null
delta_mean_guard_delta_max: null

# Optional advantage window for mean guard.
delta_mean_guard_adv_min: null
delta_mean_guard_adv_max: null

# Optional cap for mean guard scalar loss.
delta_mean_guard_loss_cap: null

# Enable per-sequence adaptive denominator for seq-mean-token-sum-norm.
seq_norm_adaptive_enable: false

# Response-length quantile used to choose the short-sequence denominator.
seq_norm_adaptive_quantile: 0.95

# EMA beta for the response-length quantile.
seq_norm_adaptive_ema_beta: 0.9

# Internal EMA state for adaptive sequence normalization.
seq_norm_adaptive_quantile_ema: null

# P95 buckets and denominators for adaptive sequence normalization.
seq_norm_adaptive_threshold_1: 4096.0
seq_norm_adaptive_threshold_2: 8192.0
seq_norm_adaptive_threshold_3: 12288.0
seq_norm_adaptive_denom_1: 8192.0
seq_norm_adaptive_denom_2: 12288.0
seq_norm_adaptive_denom_3: 16384.0
seq_norm_adaptive_denom_4: 20480.0
seq_norm_adaptive_tail_denom: 20480.0

# Enable local segment mean-gap align loss. This averages over all valid segments,
# with non-triggered segments contributing zero penalty.
local_segment_align_enable: false

# Coefficient for local segment mean-gap align.
local_segment_align_coef: 0.0

# Target lower bound for segment mean(logp_train - logp_vllm).
local_segment_align_target: -0.03

# Segment size for local segment align.
local_segment_align_size: 128

# Optional cap for each segment penalty before averaging.
local_segment_align_loss_cap: null

# Enable batch response-length gate for local segment align.
local_segment_align_length_gate_enable: false

# Batch response-length quantile used by the local segment align gate.
local_segment_align_length_gate_quantile: 0.95

# Minimum gated quantile length required before local segment align contributes.
local_segment_align_length_gate_min: 8192.0

# Minimum global response length mean required before local segment align contributes.
local_segment_align_length_gate_mean_min: 7000.0

# Minimum global response length clip ratio required before local segment align contributes.
local_segment_align_length_gate_clip_ratio_min: 0.02

# Enable rollout-KL soft gate for local segment align.
local_segment_align_kl_gate_enable: false

# Rollout-KL value where local segment align starts ramping up.
local_segment_align_kl_gate_start: 0.01

# Rollout-KL value where local segment align reaches max factor.
local_segment_align_kl_gate_full: 0.02

# Minimum multiplier for local segment align under the rollout-KL soft gate.
local_segment_align_kl_gate_min_factor: 0.0

# Maximum multiplier for local segment align under the rollout-KL soft gate.
local_segment_align_kl_gate_max_factor: 1.0

# Enable adaptive tail weighting for local segment align.
local_segment_align_adaptive_tail_enable: false

# Offset added to the full-step response length mean to start adaptive tail weighting.
local_segment_align_adaptive_tail_offset: 4096.0

# Lower bound for the adaptive tail start length.
local_segment_align_adaptive_tail_min_start: 8192.0

# Upper bound for the adaptive tail start length.
local_segment_align_adaptive_tail_max_start: 14336.0

# Ramp width from adaptive tail start to full weight.
local_segment_align_adaptive_tail_width: 4096.0

# Minimum full-step adaptive tail mass required before local segment align contributes.
local_segment_align_adaptive_tail_mass_min: 0.02

# Require full-step response clip ratio before adaptive tail align contributes.
local_segment_align_adaptive_tail_clip_gate_enable: false

# Minimum full-step response clip ratio for adaptive tail clip gate.
local_segment_align_adaptive_tail_clip_ratio_min: 0.02

# If true, adaptive tail only gates whether align runs; once active, all valid segments use uniform weight.
local_segment_align_adaptive_tail_uniform_weight: false

# Enable activation gate for local segment align using clip and raw-loss pressure signals.
local_segment_align_activation_gate_enable: false

# Full-step response clip ratio threshold for the activation clip branch.
local_segment_align_activation_clip_min: 0.005

# Step period for the activation clip branch.
local_segment_align_activation_clip_period: 4

# Required ratio between short-EMA and long-EMA raw align loss for the raw branch.
local_segment_align_activation_raw_ratio: 1.3

# Minimum short-EMA raw align loss for the raw branch.
local_segment_align_activation_raw_min: 5.0e-5

# Step period for the activation raw branch.
local_segment_align_activation_raw_period: 3

# Short EMA span for raw align loss.
local_segment_align_activation_ema_span: 20.0

# Long EMA span for raw align loss baseline.
local_segment_align_activation_baseline_span: 100.0

# Enable sequence-level mismatch gate for full-response policy loss downweighting.
seq_mismatch_gate_enable: false

# Lower bound for sequence mean old-learner minus rollout logprob gap.
seq_mismatch_gate_delta_min: null

# Upper bound for sequence mean old-learner minus rollout logprob gap.
seq_mismatch_gate_delta_max: null

# Upper bound for sequence mean current minus old logprob gap on negative-advantage responses.
seq_mismatch_gate_neg_prox_delta_max: null

# Maximum sequence advantage for applying negative-prox sequence gate.
seq_mismatch_gate_neg_adv_max: 0.0

# Policy-gradient weight for gated full responses.
seq_mismatch_gate_bad_weight: 0.3

# Enable sequence-level TBPO-style surrogate objective.
seq_tbpo_enable: false

# Upper sequence ratio clip for non-negative advantage responses.
seq_tbpo_clip_ratio_high: 0.001

# Lower sequence ratio clip width for negative advantage responses.
seq_tbpo_neg_clip_ratio_low: 0.001

# Upper sequence ratio clip width for negative advantage responses.
seq_tbpo_neg_clip_ratio_high: 0.001

# Two-sided cap for sequence-level mismatch importance weights.
seq_tbpo_tis_imp_ratio_cap: 2.0

# Enable response-length scaling for advantages.
adv_length_norm_enable: false

# Which advantages to scale by response length: neg_only, pos_only, or all.
adv_length_norm_mode: neg_only

# Reference response length for advantage scaling.
adv_length_norm_ref_len: 4096

# Power used for response-length advantage scaling.
adv_length_norm_alpha: 0.5

# Minimum advantage scale.
adv_length_norm_min_scale: 0.5

# Maximum advantage scale.
adv_length_norm_max_scale: 1.0

# Enable segment-level downweighting based on logprob gap and advantage.
seg_gate_enable: false

# Segment size for segment-level gating.
seg_gate_size: 128

# Mean logprob-gap threshold for negative segment gating.
seg_gate_neg_delta_threshold: -0.5

# Maximum mean advantage for negative segment gating.
seg_gate_neg_adv_max: 0.0

# Weight applied to negative gated segments.
seg_gate_neg_weight: 0.3

# Mean logprob-gap threshold for severe segment gating.
seg_gate_severe_delta_threshold: -1.5

# Per-token logprob-gap threshold used to count bad-token fraction in a segment.
seg_gate_bad_delta_threshold: -6.0

# Bad-token fraction threshold for severe segment gating.
seg_gate_bad_fraction_threshold: 0.02

# Weight applied to severe gated segments.
seg_gate_severe_weight: 0.1

# Enable positive-advantage segment selection.
seg_gate_pos_enable: false

# Mean logprob-gap threshold for positive segment selection.
seg_gate_pos_delta_threshold: -0.5

# Minimum mean advantage for positive segment selection.
seg_gate_pos_adv_min: 0.0

# When true, the actor forward will request entropy from the model
calculate_entropy: false

# Whether to use KL loss instead of KL reward penalty. True for GRPO
use_kl_loss: false

# Whether to enable PrefixGrouper shared-prefix forward
use_prefix_grouper: false

# Whether to use torch.compile()
# oc.select: the default val for ref.use_torch_compile
use_torch_compile: true

# KL loss coefficient when use_kl_loss is enabled. For GRPO
kl_loss_coef: 0.001

# Type of KL divergence loss. Options: "kl"(k1), "abs", "mse"(k2), "low_var_kl"(k3), "full"
kl_loss_type: low_var_kl

# Number of PPO epochs per batch
ppo_epochs: 1

# Shuffle training data across PPO epochs
shuffle: false

# The seed used to construct mini-batch
data_loader_seed: 42

# checkpoint configs
checkpoint:

  # Target dataclass for this configuration
  _target_: verl.trainer.config.CheckpointConfig

  # What to include in saved checkpoints
  # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space
  save_contents: ['model', 'optimizer', 'extra']

  # For more flexibility, you can specify the contents to load from the checkpoint.
  # .xxx refers to the local variable xxx from the same level of hierarchy similar to python pkg
  load_contents: ${.save_contents}

  # Whether to save checkpoints asynchronously. Only effective for Megatron as of now.
  async_save: False
  
  # Mbridge config extension.
  # when vanilla_mbridge=True, and your filesystem is a distributed filesystem,(which means you write a file in node A
  # and you can read the file in node B immediately)
  # set `mbridge_config.distributed_filesystem=True` and `mbridge_config.memory_efficient=True` to 
  # speed up the checkpoint saving by 10x speed.
  mbridge_config: {}

# optimizer configs
optim:

  # Learning rate
  lr: 1e-6

  # Warmup steps ratio (used if lr_warmup_steps is 0 or negative)
  lr_warmup_steps_ratio: 0.0

  # Total training steps (must be overridden at runtime)
  total_training_steps: -1

  # Weight decay
  weight_decay: 0.01

  # Prioritized. None, 0 or Negative values mean delegating to lr_warmup_steps_ratio.
  lr_warmup_steps: -1


# Whether to use custom fused kernels (e.g., FlashAttention, fused MLP)
use_fused_kernels: ${oc.select:actor_rollout_ref.model.use_fused_kernels,false}

# profile the actor model in `update_policy` 
profiler:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.utils.profiler.ProfilerConfig

  # profiler tool, default same as profiler.tool in global config
  # choices: nsys, npu, torch
  tool: ${oc.select:global_profiler.tool,null}

  # whether enable profile on Actor
  enable: False
  
  # Whether to profile all ranks.
  all_ranks: False

  # The ranks that will be profiled. [] or [0,1,...]
  ranks: []

  # profile results saving path
  save_path: ${oc.select:global_profiler.save_path,null}

  # specific tool config which only related to the role
  tool_config:

    # nsys tool config
    nsys:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NsightToolConfig
    
      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: ${oc.select:global_profiler.global_tool_config.nsys.discrete}
    
    # npu config
    npu:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NPUToolConfig

      # Contents to profile, can be empty
      # options: npu, cpu, memory, shapes, module, stack
      contents: []

      # Collection level, optional values: level_none, level0, level1, level2.
      level: "level0"

      # Whether to automatically parse the data.
      analysis: True

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: False
    
    # torch profiler config
    torch:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchProfilerToolConfig

      # Contents to profile, can be empty
      # options: cuda, cpu, memory, shapes, stack
      contents: []

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: false

    # torch memory profiler config
    torch_memory:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchMemoryToolConfig

      # Maximum number of memory allocation entries to track
      trace_alloc_max_entries: ${oc.select:global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries,100000}

      # Stack trace depth for memory allocations
      stack_depth: ${oc.select:global_profiler.global_tool_config.torch_memory.stack_depth,32}

    # msprobe precision debugger config
    precision_debugger:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.PrecisionDebuggerToolConfig

      # Path to msprobe config json
      config_path: ${oc.select:global_profiler.global_tool_config.precision_debugger.config_path,null}

      # Deprecated and ignored. Use global_profiler.steps.
      steps: null

      # Profile stages
      # Supported stages: actor_update, actor_compute_log_prob, ref_compute_log_prob,
      # compute_values, critic_update, compute_rm_score
      stages: ${oc.select:global_profiler.global_tool_config.precision_debugger.stages,null}

      # Whether to fail on unknown stage or missing msprobe
      strict: ${oc.select:global_profiler.global_tool_config.precision_debugger.strict,False}

# Router replay configuration for MoE models
router_replay:

  # Target dataclass for this configuration
  _target_: verl.workers.config.RouterReplayConfig

  # Router replay mode: disabled, R2, R3
  # - R2: Use R2 routing strategy (record mode)
  # - R3: Use R3 routing strategy (record mode)
  mode: disabled

  # File path to save recorded routing decisions
  # Required when mode is 'record', 'R2', or 'R3'
  record_file: null

  # File path to load recorded routing decisions for replay
  # Required when mode is 'replay'
  replay_file: null

# QAT (Quantization-Aware Training) configuration
# When enabled:
#   - QAT is automatically applied to actor model during training
#   - Fused scales (QKV/GateUp) are automatically enabled for training-inference consistency
#   - Fast quantization is used when syncing weights to vLLM rollout
# Supported modes: "w4a16" (NVFP4 weight-only)
# Note: "w4a4" mode is included in the code but currently has KL divergence issues and is NOT recommended for use.
# For usage examples, see: https://github.com/verl-project/verl-recipe/blob/main/qat/README.md
qat:

  # Whether to enable QAT
  enable: false

  # Quantization mode: "w4a16" (weight-only). "w4a4" is experimental and not recommended.
  mode: "w4a16"

  # Quantization group size (NVFP4 requires 16)
  group_size: 16

  # Patterns to ignore (e.g., lm_head, embed_tokens)
  ignore_patterns:

    - "lm_head"
    - "embed_tokens"
    - "re:.*mlp.gate$"

  # Activation observer for W4A4 mode: "static_minmax", "memoryless_minmax", or "minmax"
  activation_observer: "static_minmax"

  # Path to vLLM quantization config JSON file
  quantization_config_path: null
